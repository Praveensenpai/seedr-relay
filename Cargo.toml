[package]
name = "seedr-relay"
version = "0.1.0"
edition = "2021"
authors = ["Praveensenpai <pvnt20@gmail.com>"]
description = "Sequential queue manager and file sanitizer using seedr-dl"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
dirs = "5"
libc = "0.2"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
seedr-dl = { path = "../seedr-dl" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"

[lints.rust]
unused = "deny"
dead_code = "deny"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_arguments = "deny"
unwrap_used = "deny"
expect_used = "deny"
